name: Update Trendigger

on:
  # Every 4 hours (Google Trends' smallest granularity is "past 4 hours").
  schedule:
    - cron: '0 */4 * * *'
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Force --full rebuild (re-render every page)'
        type: boolean
        default: false
      skip_enrich:
        description: 'Skip Gemini enrich (save quota)'
        type: boolean
        default: false
      skip_collect:
        description: 'Skip collect (only rebuild from existing data)'
        type: boolean
        default: false

# Prevent overlapping runs (the previous run keeps the lock). 4h cadence with
# a 45min timeout leaves comfortable headroom; a queued run waits for the
# previous one to finish rather than being cancelled.
concurrency:
  group: trendigger-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      # Talk to real Cloudflare D1 instead of local sqlite.
      D1_REMOTE: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_PROVIDER: snippet
      # 不再使用 cloudflare fallback：snippet 抓取失败就留空，省时间省配额
      FALLBACK_PROVIDER: ''

    steps:
      - name: Setup SSH agent for private submodule
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY_FUNCTIONS }}

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # wrangler.toml 不进仓库（含 D1 database_id），从模板 + secret 现场生成。
      # db.js 调 `wrangler d1 execute` 需要它来把 database_name 解析成 id。
      - name: Materialize wrangler.toml from secret
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: sed "s/__D1_DATABASE_ID__/${D1_DATABASE_ID}/" wrangler.toml.example > wrangler.toml

      - name: Collect (fetch Google Trends via google-trends-now for all geos → D1)
        if: ${{ inputs.skip_collect != true }}
        run: node collect-trends.js

      - name: Enrich (generate AI summaries for new keywords)
        if: ${{ inputs.skip_enrich != true }}
        run: node src/enrich.js

      - name: Prune (delete snapshots older than 365 days)
        run: node src/prune.js --days 365

      - name: Build static site
        run: |
          if [ "${{ inputs.full_rebuild }}" = "true" ]; then
            node src/build.js --full --days=1
          else
            node src/build.js --days=1
          fi

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@latest pages deploy public \
            --project-name=trendigger-new \
            --branch=main \
            --commit-dirty=true

      - name: Print summary
        if: always()
        run: |
          echo "Run finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ls -la public/geo 2>/dev/null | head -30 || true
